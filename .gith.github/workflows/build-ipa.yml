name: Build iOS App to IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Build and Package IPA
      run: |
        echo "جارٍ البحث عن ملف المشروع لبنائه..."
        if find . -name "*.xcodeproj" -maxdepth 2 | grep -q .; then
            PROJECT_FILE=$(find . -name "*.xcodeproj" -maxdepth 2 | head -n 1)
            SCHEME_NAME=$(basename "$PROJECT_FILE" .xcodeproj)
            
            echo "تم العثور على المشروع: $PROJECT_FILE"
            
            xcodebuild -project "$PROJECT_FILE" \
                       -scheme "$SCHEME_NAME" \
                       -configuration Release \
                       -sdk iphoneos \
                       -derivedDataPath build \
                       CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
                       
            echo "تم الانتهاء من عملية البناء بنجاح!"
        else
            echo "لم يتم العثور على ملف xcodeproj. تأكد من أن مشروعك يحتوي على ملفات مصدرية صحيحة."
            exit 1
        fi

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Generated-IPA
        path: |
          build/**/*.app
          build/**/*.ipa
          
